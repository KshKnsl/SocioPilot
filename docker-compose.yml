services:
  mongo:
    image: mongo:7
    container_name: sociopilot-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    container_name: sociopilot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  api:
    build:
      context: ./server
    container_name: sociopilot-api
    restart: unless-stopped
    depends_on:
      - mongo
      - redis
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/sociopilot
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: change-me
      ENCRYPTION_KEY: change-me-change-me-change-me-change-me

  worker:
    build:
      context: ./server
    container_name: sociopilot-worker
    restart: unless-stopped
    depends_on:
      - mongo
      - redis
    command: ["npm", "run", "worker"]
    environment:
      MONGODB_URI: mongodb://mongo:27017/sociopilot
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: change-me
      ENCRYPTION_KEY: change-me-change-me-change-me-change-me

volumes:
  mongo-data:
  redis-data: